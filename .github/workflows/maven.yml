name: Build and Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ "main" ]
    # Only run this job if files inside the backend folder changed!
    paths:
      - 'backend/**'
      - '.github/workflows/maven.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t eireweather-backend -f backend/Dockerfile backend

      - name: Restart Docker Container
        run: |
          # Stop and remove old container if it exists
          docker stop weather-app || true
          docker rm weather-app || true
          
          # Run the new container in detached mode
          docker run -d -p 8080:8080 --name weather-app --restart always eireweather-backend