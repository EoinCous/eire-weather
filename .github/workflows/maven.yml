name: Build and Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      # 1. Checkout repository code directly on EC2
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Set up Java JDK 17
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # 3. Build the JAR file locally on EC2
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Copy built JAR locally (No Docker or SCP required)
      - name: Copy JAR to App Directory
        run: |
          mkdir -p /home/ec2-user/app-build
          cp target/weatherservice-0.0.1-SNAPSHOT.jar /home/ec2-user/app-build/
          
          # Verification: Ensure file was copied
          ls -lh /home/ec2-user/app-build/

      # 5. Stop previous process and restart backend
      - name: Restart Application
        run: |
          # Stop active Java process if running
          kill -15 $(pgrep -f 'java -jar') || true
          
          # Pause 2 seconds for graceful release of port 8080
          sleep 2
          
          # Start updated app in background
          nohup java -jar /home/ec2-user/app-build/weatherservice-0.0.1-SNAPSHOT.jar > /home/ec2-user/app.log 2>&1 &