name: Build and Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/maven.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      # Run tests and package on the host runner safely
      - name: Build and Test with Maven
        run: ./mvnw clean package -DskipTests

      # Build the lightweight Docker image using the pre-compiled JAR
      - name: Build Docker Image
        run: docker build -t eire-weather-backend:latest .