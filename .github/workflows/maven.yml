name: Build and Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**'
      - '.github/workflows/maven.yml'

jobs:
  build-and-deploy:
    runs-on: self-hosted
    
    defaults:
      run:
        working-directory: ./backend 

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Build and Package
        run: ./mvnw clean package -DskipTests

      - name: Build Docker Image
        run: docker build -t eire-weather-backend:latest .

      - name: Restart Docker Container
        run: |
          docker stop eire-weather-app || true
          docker rm eire-weather-app || true
          docker run -d --name eire-weather-app -p 8080:8080 eire-weather-backend:latest